name: SomaFlight
options:
  bundleIdPrefix: me.somalabs
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The app and its widget extension must carry the same versions.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FlightKit:
    path: Packages/FlightKit
targets:
  SomaFlight-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes: ["Info*.plist", "*.xcconfig", "*.entitlements"]
    configFiles:
      Debug: Apps/iOS/Config.Debug.xcconfig
      Release: Apps/iOS/Config.Release.xcconfig
    entitlements:
      path: Apps/iOS/SomaFlight.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Push Notifications. The signing profile decides the environment on a device build; Release
        # archives for production.
        aps-environment: $(APS_ENVIRONMENT)
        # Shared with the widget extension: the Live Activity reads the clock setting here, the widgets
        # the My Flights snapshot.
        com.apple.security.application-groups: [group.me.somalabs.flight]
    dependencies:
      - package: FlightKit
        product: FlightKit
      # The flight Live Activity and the home screen and lock screen widgets (embedded app extension).
      - target: SomaFlightWidgets
      # The Apple Watch app (with its complications), fed My Flights over WatchConnectivity.
      - target: SomaFlightWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.flight
        PRODUCT_NAME: SomaFlight
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only in v1 (every layout and screenshot is a phone); iPad later, with all four orientations.
        TARGETED_DEVICE_FAMILY: "1"
        # Supabase URL and anon key (from Config.Debug/Release.xcconfig), the somaflight:// sign-in
        # callback and NSSupportsLiveActivities. Debug's plist also allows local networking for the local stack.
        INFOPLIST_FILE: Apps/iOS/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Settings > Calendar (asked when the switch is turned on) and the "Leave by" time (asked from its
        # breakdown, while the app is in use only).
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Soma Flight adds the flights you follow to the calendar you pick and keeps them up to date. Nothing leaves your device.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Soma Flight uses your location while the app is open to time when to leave for the airport. It is never stored or sent to Soma Flight.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Debug:
          APS_ENVIRONMENT: development
          INFOPLIST_FILE: Apps/iOS/Info-Debug.plist
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets: []
  SomaFlight-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
        excludes: ["Info*.plist", "*.xcconfig", "*.entitlements"]
    configFiles:
      Debug: Apps/macOS/Config.Debug.xcconfig
      Release: Apps/macOS/Config.Release.xcconfig
    dependencies:
      - package: FlightKit
        product: FlightKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.flight
        PRODUCT_NAME: SomaFlight
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Supabase URL and anon key (from Config.Debug/Release.xcconfig) and the somaflight:// sign-in
        # callback. Debug's plist also allows local networking for the local stack.
        INFOPLIST_FILE: Apps/macOS/Info.plist
        # Settings > Calendar and the "Leave by" time; the sandbox entitlements are in both .entitlements files.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Soma Flight adds the flights you follow to the calendar you pick and keeps them up to date. Nothing leaves your Mac.
        INFOPLIST_KEY_NSLocationUsageDescription: Soma Flight uses your location while the app is open to time when to leave for the airport. It is never stored or sent to Soma Flight.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Soma Flight uses your location while the app is open to time when to leave for the airport. It is never stored or sent to Soma Flight.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Read access to files the user picks (Passport CSV import, boarding pass file) or opens with the app
        # (.pkpass). Also in both entitlements files, which win at signing.
        ENABLE_USER_SELECTED_FILES: readonly
      configs:
        # Sign in with Apple and Push Notifications (com.apple.developer.aps-environment) need a provisioning
        # profile, which a Mac build signed to run locally has not: Debug keeps the sandbox and network only
        # (email sign-in works, no remote pushes), Release carries both capabilities.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/macOS/SomaFlight-Debug.entitlements
          INFOPLIST_FILE: Apps/macOS/Info-Debug.plist
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/macOS/SomaFlight.entitlements
    scheme:
      testTargets: []
  SomaFlightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widgets
        excludes: ["Info.plist", "*.entitlements"]
    entitlements:
      path: Apps/Widgets/SomaFlightWidgets.entitlements
      properties:
        # Reads the app's clock setting (24 or 12 hour) and the My Flights snapshot the widgets draw.
        com.apple.security.application-groups: [group.me.somalabs.flight]
    dependencies:
      # Only the Live Activity and widget models and views: FlightKit would pull Supabase and MapKit into the
      # extension, which has a tight memory budget and needs neither.
      - package: FlightKit
        product: FlightActivityKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.flight.widgets
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: SomaFlightWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Soma Flight
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  SomaFlightWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/Watch
        excludes: ["*.entitlements"]
    entitlements:
      path: Apps/Watch/SomaFlightWatch.entitlements
      properties:
        # The watch's own container: keeps the snapshot from the iPhone for the complications.
        com.apple.security.application-groups: [group.me.somalabs.flight]
    dependencies:
      # The snapshot and the watch's models: no Supabase, the watch only hears from the phone in v1.
      - package: FlightKit
        product: FlightWatchKit
      - target: SomaFlightComplications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.flight.watchkitapp
        PRODUCT_NAME: SomaFlightWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Soma Flight
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: me.somalabs.flight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  SomaFlightComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/WatchWidgets
        excludes: ["Info.plist", "*.entitlements"]
    entitlements:
      path: Apps/WatchWidgets/SomaFlightComplications.entitlements
      properties:
        # Reads the snapshot the watch app keeps.
        com.apple.security.application-groups: [group.me.somalabs.flight]
    dependencies:
      - package: FlightKit
        product: FlightWatchKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.flight.watchkitapp.complications
        PRODUCT_NAME: SomaFlightComplications
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/WatchWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Soma Flight
        SKIP_INSTALL: YES
