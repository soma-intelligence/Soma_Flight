[package]
name = "flightcore-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "flightcore_ffi"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# Keeps bindgen (askama, cargo_metadata, clap) out of the static library.
required-features = ["cli"]

[dependencies]
flightcore = { path = "../flightcore" }
uniffi = "0.32.2"

[features]
cli = ["uniffi/cli"]
